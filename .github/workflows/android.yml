name: Android

on:
  push:
    paths:
      - "android/**"
      - "docs/fixtures/**"
      - "config/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "docs/fixtures/**"
      - "config/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout (full history: versionCode = commit count)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore (only if the secret exists)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/budget-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/budget-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore restored."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: the release APK will be signed with the debug key (-UNSIGNED-DEBUGKEY)."
          fi

      - name: Unit tests (domain fixtures, sync engine, migrations)
        run: ./gradlew --no-configuration-cache testDebugUnitTest

      - name: Lint (fails on errors only)
        run: ./gradlew --no-configuration-cache lintDebug

      - name: Assemble release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache assembleRelease

      - name: Name the artifact
        id: meta
        run: |
          ./gradlew --no-configuration-cache -q printVersion > "$RUNNER_TEMP/version.txt"
          NAME=$(grep '^versionName=' "$RUNNER_TEMP/version.txt" | cut -d= -f2)
          CODE=$(grep '^versionCode=' "$RUNNER_TEMP/version.txt" | cut -d= -f2)
          SIGNED=$(grep '^releaseSigned=' "$RUNNER_TEMP/version.txt" | cut -d= -f2)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          SUFFIX=""
          if [ "$SIGNED" != "true" ]; then SUFFIX="-UNSIGNED-DEBUGKEY"; fi
          OUT="budget-${NAME}-${CODE}${SUFFIX}.apk"
          cp "$APK" "$RUNNER_TEMP/$OUT"
          echo "file=$RUNNER_TEMP/$OUT" >> "$GITHUB_OUTPUT"
          echo "name=budget-${NAME}-${CODE}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.meta.outputs.file }}
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/budget-release.jks"
